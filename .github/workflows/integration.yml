name: Integration
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Run daily at 3:17 AM UTC (off-peak hours, odd minute to avoid congestion)
    - cron: '17 3 * * *'

jobs:
  integration:
    name: Integration tests (Python ${{ matrix.python }}, ${{ matrix.os }}, dockware)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.13"]
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
      PYTHONIOENCODING: "utf-8"
      UV_LINK_MODE: "copy"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          prune-cache: false

      # Start dockware container (manual start works on all platforms)
      - name: Start dockware container
        shell: bash
        run: |
          echo "Starting dockware container..."
          docker pull dockware/dev:latest
          docker run -d --name dockware -p 80:80 dockware/dev:latest
          echo "Container started, waiting for initialization..."

      - name: Install tomli (Python < 3.11)
        shell: bash
        run: python -c "import tomllib" 2>/dev/null || uv pip install tomli --system

      - name: Extract project metadata
        id: metadata
        uses: ./.github/actions/extract-metadata

      - name: Install dev deps
        shell: bash
        run: uv pip install -e .[dev] --system

      - name: Wait for dockware to be ready
        shell: bash
        run: |
          echo "Waiting for dockware container to be ready..."
          for i in {1..120}; do
            # Check /admin endpoint (same as our _is_local_docker_container_active check)
            if curl -s -o /dev/null -w "%{http_code}" http://localhost/admin 2>/dev/null | grep -qE "200|302|301"; then
              echo "Dockware is ready!"
              exit 0
            fi
            echo "Waiting... ($i/120)"
            sleep 5
          done
          echo "Dockware failed to become ready"
          exit 1

      - name: Run integration tests
        shell: bash
        env:
          TEST_VERBOSE: "1"
          COVERAGE_FILE: "${{ runner.temp }}/.coverage"
        run: >-
          python -m pytest -m "integration"
          --cov=${{ env.SRC_PATH }}/${{ env.PACKAGE_MODULE }}
          --cov-report=term-missing
          --cov-report=xml:coverage-integration.xml
          ${{ env.PYTEST_VERBOSITY }}

      - name: Upload integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v7
        with:
          files: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false

      - name: Stop dockware container
        if: always()
        shell: bash
        run: |
          docker stop dockware || true
          docker rm dockware || true

      - name: Prune uv cache
        continue-on-error: true
        shell: bash
        run: uv cache prune --ci
